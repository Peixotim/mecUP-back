# Compose para ambiente de desenvolvimento do mecUp.
# Sobe Postgres + Redis com healthchecks e volumes nomeados.
# A API (hot reload) fica no profile "dev": opcional, ative com --profile dev.
#
#   docker compose up -d                 -> sobe apenas postgres + redis
#   docker compose --profile dev up -d   -> sobe postgres + redis + api
name: mecup

services:
  postgres:
    image: postgres:17-alpine
    container_name: mecup_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mecup_network

  redis:
    image: redis:7-alpine
    container_name: mecup_redis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # requirepass: protege o Redis com senha | appendonly: persistência AOF
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mecup_network

  # API em modo desenvolvimento com hot reload (tsx watch).
  # Opcional: só sobe quando o profile "dev" é ativado.
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: mecup_api
    restart: unless-stopped
    profiles: ['dev']
    env_file:
      - .env
    environment:
      NODE_ENV: development
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mecup_network

volumes:
  postgres_data:
    name: mecup_postgres_data
  redis_data:
    name: mecup_redis_data
  api_node_modules:
    name: mecup_api_node_modules

networks:
  mecup_network:
    name: mecup_network
    driver: bridge
